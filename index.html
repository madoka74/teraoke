<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노래방 가사 디스플레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void:      #0e1016;
    --bg-stage:     #14171f;
    --spotlight:    #e8a33d;
    --spotlight-dim:#e8a33d33;
    --accent-rose:  #c4485c;
    --text-main:    #f2ede4;
    --text-dim:     #8b8680;
    --text-faint:   #55524c;
    --panel-border: #262a35;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-void);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ── 상단: 앨범아트 + 메타정보 (스포트라이트 아래 무대) ── */
  header {
    position: relative;
    display: flex;
    align-items: center;
    gap: clamp(16px, 3vw, 36px);
    padding: clamp(16px, 3vh, 32px) clamp(20px, 5vw, 56px);
    flex-shrink: 0;
    background: var(--bg-stage);
    border-bottom: 1px solid var(--panel-border);
    overflow: hidden;
  }

  /* 시그니처 요소: 앨범아트 뒤에서 번지는 스포트라이트 글로우 */
  header::before {
    content: "";
    position: absolute;
    top: 50%;
    left: clamp(20px, 5vw, 56px);
    width: clamp(120px, 14vw, 180px);
    height: clamp(120px, 14vw, 180px);
    transform: translateY(-50%);
    background: radial-gradient(circle, var(--spotlight-dim) 0%, transparent 70%);
    filter: blur(20px);
    pointer-events: none;
    transition: opacity 0.6s ease;
    opacity: 0;
  }
  header.has-song::before { opacity: 1; }

  #art-wrap {
    position: relative;
    flex-shrink: 0;
    width: clamp(88px, 11vw, 148px);
    height: clamp(88px, 11vw, 148px);
    border-radius: 10px;
    overflow: hidden;
    background: #1b1e27;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
  }
  #art-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }
  #art-wrap.loaded img { display: block; }
  #art-wrap .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(28px, 4vw, 44px);
    color: var(--text-faint);
  }
  #art-wrap.loaded .placeholder { display: none; }

  #meta {
    min-width: 0;
    position: relative;
  }
  #meta .eyebrow {
    font-size: clamp(10px, 1vw, 12px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--spotlight);
    font-weight: 600;
    margin: 0 0 6px;
  }
  #song-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(22px, 3.4vw, 40px);
    line-height: 1.15;
    margin: 0 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #song-sub {
    font-size: clamp(13px, 1.5vw, 17px);
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #song-sub .dot { margin: 0 8px; color: var(--text-faint); }

  /* ── 본문: 전체 가사 ── */
  main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    padding: clamp(28px, 5vh, 64px) clamp(20px, 6vw, 40px) clamp(60px, 10vh, 120px);
  }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 6px; }
  main::-webkit-scrollbar-track { background: transparent; }

  #lyrics {
    max-width: 760px;
    width: 100%;
    font-size: clamp(19px, 2.4vw, 30px);
    line-height: 1.9;
    font-weight: 500;
    color: var(--text-main);
    white-space: pre-wrap;
    text-align: center;
  }

  /* 줄 단위 싱크 모드: 각 가사 줄이 .lyric-line div로 렌더링됨 */
  .lyric-line {
    opacity: 0.4;
    transition: opacity 0.35s ease, transform 0.35s ease, color 0.35s ease;
    padding: 3px 0;
    white-space: pre-wrap;
  }
  .lyric-line.current {
    opacity: 1;
    color: var(--spotlight);
    font-weight: 600;
    transform: scale(1.05);
  }
  .lyric-line.passed {
    opacity: 0.6;
  }
  /* 앵커(재생 위치) 미수신 상태: 하이라이트 불가하니 전체를 밝게 표시 */
  #lyrics.nosync .lyric-line {
    opacity: 0.95;
  }

  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    max-width: 420px;
  }
  #empty-state .icon {
    font-size: 40px;
    margin-bottom: 14px;
    opacity: 0.6;
  }
  #empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--text-main);
    font-size: 22px;
    margin: 0 0 10px;
  }
  #empty-state p {
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
  }
  #empty-state code {
    background: var(--bg-stage);
    border: 1px solid var(--panel-border);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--spotlight);
  }

  #status-line {
    color: var(--text-dim);
    font-size: 15px;
    text-align: center;
  }

  /* ── 노래방 시작/종료 토글 버튼 (헤더 우측) ── */
  #karaoke-toggle {
    flex-shrink: 0;
    margin-left: auto;
    align-self: center;
    border: 1px solid var(--panel-border);
    background: var(--bg-void);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: clamp(13px, 1.4vw, 16px);
    letter-spacing: 0.02em;
    padding: clamp(10px, 1.4vh, 14px) clamp(18px, 2.4vw, 28px);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #karaoke-toggle .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    background: var(--text-faint);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  /* 대기 상태 (시작 가능) */
  #karaoke-toggle[data-state="idle"] {
    background: var(--spotlight);
    border-color: var(--spotlight);
    color: #1a1206;
  }
  #karaoke-toggle[data-state="idle"] .dot {
    background: #1a1206;
    box-shadow: none;
  }
  /* 실행 중 (종료 가능) */
  #karaoke-toggle[data-state="running"] {
    background: var(--bg-void);
    border-color: var(--accent-rose);
    color: var(--text-main);
  }
  #karaoke-toggle[data-state="running"] .dot {
    background: var(--accent-rose);
    box-shadow: 0 0 8px var(--accent-rose);
    animation: pulse 1.6s ease-in-out infinite;
  }
  /* 전환 중 (커맨드 대기) — 잠시 비활성 */
  #karaoke-toggle[data-state="pending"] {
    opacity: 0.55;
    pointer-events: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  @media (max-width: 560px) {
    header { gap: 14px; padding: 14px 18px; flex-wrap: wrap; }
    #song-title { white-space: normal; }
    #song-sub { white-space: normal; }
    #karaoke-toggle { margin-left: 0; width: 100%; margin-top: 4px; }
  }
</style>
</head>
<body>

<header id="header">
  <div id="art-wrap">
    <div class="placeholder">♪</div>
    <img id="art-img" alt="">
  </div>
  <div id="meta">
    <p class="eyebrow">지금 재생 중</p>
    <h1 id="song-title">노래를 기다리는 중…</h1>
    <p id="song-sub"></p>
  </div>
  <button id="karaoke-toggle" data-state="idle" type="button">
    <span class="dot"></span><span id="karaoke-toggle-label">노래방 시작</span>
  </button>
</header>

<main>
  <div id="empty-state">
    <div class="icon">🎤</div>
    <h2>대기 중</h2>
    <p>
      곡 정보가 들어오면 여기에 가사가 표시됩니다.<br>
      테스트하려면 URL에 다음처럼 붙여보세요:<br><br>
      <code>?artist=아이유&title=좋은날&album=REAL</code>
    </p>
  </div>
  <div id="lyrics" style="display:none;"></div>
</main>

<script>
(function () {
  // ─────────────────────────────────────────────
  // 백엔드(Mac Mini 프록시) 설정 — 확정되면 BACKEND_URL만 채우면 됨
  //   기대하는 엔드포인트 계약:
  //   GET  {BACKEND_URL}/genie-lyrics?artist=&title=  → {"lyrics": "..." | null}
  //   GET  {BACKEND_URL}/now-playing                   → {"artist":"","album":"","title":""} | null
  //   POST {BACKEND_URL}/karaoke-start                  → 노래방 시작(프록시가 ST 스위치 ON)
  //   POST {BACKEND_URL}/karaoke-stop                   → 노래방 종료(프록시가 ST 스위치 OFF)
  // ─────────────────────────────────────────────
  const CONFIG = {
    BACKEND_URL: 'https://teraoke.serveousercontent.com',
    POLL_INTERVAL_MS: 2500,   // 실행 중에만: now-playing 폴링 주기 (= 하트비트)
    LYRIC_OFFSET_MS: 1500,    // 가사 하이라이트 선행 보정(ms). 늦으면 ↑, 빠르면 ↓
  };

  const headerEl   = document.getElementById('header');
  const artWrap     = document.getElementById('art-wrap');
  const artImg       = document.getElementById('art-img');
  const titleEl       = document.getElementById('song-title');
  const subEl           = document.getElementById('song-sub');
  const lyricsEl          = document.getElementById('lyrics');
  const emptyStateEl        = document.getElementById('empty-state');

  // ─────────────────────────────────────────────
  // 앨범아트: iTunes Search API (공개, CORS 허용, 인증 불필요)
  // ─────────────────────────────────────────────
  async function fetchArtwork(artist, title) {
    const term = encodeURIComponent(`${artist} ${title}`);
    const url = `https://itunes.apple.com/search?term=${term}&media=music&limit=1`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`iTunes 검색 실패: HTTP ${res.status}`);
    const data = await res.json();
    if (!data.results || data.results.length === 0) return null;
    // artworkUrl100 → 더 큰 사이즈로 치환 (공식 지원되는 URL 패턴)
    return data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
  }

  // ─────────────────────────────────────────────
  // 가사: 모든 소스가 {lines: [{t(ms), text}] | null, plain: string | null} 통일 형식 반환.
  //   lines가 있으면 줄 단위 실시간 하이라이트, 없으면 전체 텍스트 표시(기존 방식).
  //   우선순위: 지니(싱크) → LRCLIB(싱크/텍스트) → lyrics.ovh(텍스트)
  // ─────────────────────────────────────────────

  // LRC 형식 "[mm:ss.xx] 가사" → [{t, text}] 파싱
  function parseLrcToLines(syncedLyrics) {
    const lines = [];
    for (const raw of syncedLyrics.split('\n')) {
      const m = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
      if (!m) continue;
      const t = Math.round((parseInt(m[1], 10) * 60 + parseFloat(m[2])) * 1000);
      const text = m[3].trim();
      if (text !== '') lines.push({ t, text });
    }
    return lines.length > 0 ? lines : null;
  }

  async function fetchLyricsFromLrclib(artist, title, album) {
    const params = new URLSearchParams({ track_name: title, artist_name: artist });
    if (album) params.set('album_name', album);
    const res = await fetch(`https://lrclib.net/api/get?${params.toString()}`);
    if (!res.ok) return null;
    const data = await res.json();
    if (data.syncedLyrics) {
      const lines = parseLrcToLines(data.syncedLyrics);
      if (lines) return { lines, plain: lines.map(l => l.text).join('\n') };
    }
    if (data.plainLyrics) return { lines: null, plain: data.plainLyrics };
    return null;
  }

  async function fetchLyricsFromOvh(artist, title) {
    const url = `https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    return data.lyrics ? { lines: null, plain: data.lyrics } : null;
  }

  // ─────────────────────────────────────────────
  // 지니뮤직 — genie.co.kr 직접 호출은 CORS로 막혀 백엔드가 대신 조회.
  // 백엔드가 타임스탬프 보존된 lines([{t,text}])와 전체 텍스트(lyrics)를 함께 반환.
  // ─────────────────────────────────────────────
  async function fetchLyricsFromGenie(artist, title) {
    if (!CONFIG.BACKEND_URL) return null;
    const url = `${CONFIG.BACKEND_URL}/genie-lyrics?artist=${encodeURIComponent(artist)}&title=${encodeURIComponent(title)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    if (data.lines && data.lines.length > 0) return { lines: data.lines, plain: data.lyrics || '' };
    if (data.lyrics) return { lines: null, plain: data.lyrics };
    return null;
  }

  async function fetchLyrics(artist, title, album) {
    try {
      const fromGenie = await fetchLyricsFromGenie(artist, title);
      if (fromGenie) return fromGenie;
    } catch (e) { console.warn('[lyrics] genie(백엔드) 실패:', e); }

    try {
      const fromLrclib = await fetchLyricsFromLrclib(artist, title, album);
      if (fromLrclib) return fromLrclib;
    } catch (e) { console.warn('[lyrics] lrclib 실패:', e); }

    try {
      const fromOvh = await fetchLyricsFromOvh(artist, title);
      if (fromOvh) return fromOvh;
    } catch (e) { console.warn('[lyrics] lyrics.ovh 실패:', e); }

    return null;
  }

  // ─────────────────────────────────────────────
  // 재생 위치 트래커 (앵커 + 로컬 시계)
  //   드라이버가 10초마다 프록시에 elapsed를 보내고, 웹은 now-playing 폴링(2.5초)으로
  //   앵커(posMs, 받은 시각)를 갱신. 그 사이는 브라우저 로컬 시계로 진행을 추정.
  //   현재위치 ≈ posMs + (지금 - anchorAt), Paused/Stopped면 시계 정지.
  //   줄 단위 하이라이트용이라 ±수 초 오차는 허용 범위.
  // ─────────────────────────────────────────────
  const tracker = {
    posMs: 0,        // 앵커 시점의 재생 위치(ms)
    anchorAt: 0,     // 앵커를 받은 브라우저 시각 (performance.now())
    playing: false,  // Playing 상태에서만 시계 진행
    hasAnchor: false,
    lastRawElapsed: null, // 프록시가 준 마지막 elapsed_ms 원본값(변화 감지용)
  };
  let syncedLines = null;      // 현재 곡의 [{t, text}] (없으면 plain 모드)
  let lineEls = [];            // 렌더링된 .lyric-line 요소들
  let currentLineIdx = -1;
  let highlightTimer = null;

  // 앵커는 elapsed 값이 "실제로 바뀌었을 때만" 다시 잡는다.
  //   - 매 폴링(2.5초)마다 재앵커하면, 드라이버 POST(10초)로 age가 0으로 리셋될 때
  //     위치가 뒤로 튕겨 톱니처럼 왕복한다(줄 건너뜀 + 누적 지연의 원인).
  //   - Tesla의 elapsed가 갱신 안 되는 경우에도 로컬 시계로 자유 진행하므로 안전.
  function setAnchor(elapsedMs, ageMs, status) {
    const raw = elapsedMs || 0;
    // 상태값이 비어있거나 모르는 값이면 "재생 중"으로 간주한다.
    // (status를 안 보내는 버전과 호환 — 'Playing' 일치만 보면 시계가 멈춰버림)
    const st = String(status || '').toLowerCase();
    const nowPlaying = !(st === 'paused' || st === 'stopped');

    // 일시정지 → 재생 재개: 현재 추정 위치를 유지한 채 시계만 다시 흐르게 함
    if (nowPlaying && tracker.hasAnchor && !tracker.playing) {
      tracker.anchorAt = performance.now();
    }
    // 재생 → 일시정지: 지금까지 흐른 만큼을 확정해 두고 시계 정지
    if (!nowPlaying && tracker.hasAnchor && tracker.playing) {
      tracker.posMs = tracker.posMs + (performance.now() - tracker.anchorAt);
      tracker.anchorAt = performance.now();
    }
    tracker.playing = nowPlaying;

    // elapsed 원본값이 바뀌었을 때(또는 최초)만 하드 재앵커
    if (!tracker.hasAnchor || raw !== tracker.lastRawElapsed) {
      tracker.lastRawElapsed = raw;
      tracker.posMs = raw + (ageMs || 0);
      tracker.anchorAt = performance.now();
      tracker.hasAnchor = true;
    }
  }

  // 곡이 바뀌면 앵커를 완전히 초기화(이전 곡 위치가 새 곡에 새는 것 방지)
  function resetAnchor() {
    tracker.posMs = 0;
    tracker.anchorAt = 0;
    tracker.playing = false;
    tracker.hasAnchor = false;
    tracker.lastRawElapsed = null;
  }

  function estimatePosMs() {
    if (!tracker.hasAnchor) return -1;
    if (!tracker.playing) return tracker.posMs + CONFIG.LYRIC_OFFSET_MS;
    return tracker.posMs + (performance.now() - tracker.anchorAt) + CONFIG.LYRIC_OFFSET_MS;
  }

  function updateHighlight() {
    if (!syncedLines || lineEls.length === 0) return;
    const pos = estimatePosMs();
    if (pos < 0) { lyricsEl.classList.add('nosync'); return; }
    lyricsEl.classList.remove('nosync');

    // 현재 줄 = t <= pos 인 마지막 줄
    let idx = -1;
    for (let i = 0; i < syncedLines.length; i++) {
      if (syncedLines[i].t <= pos) idx = i;
      else break;
    }
    if (idx === currentLineIdx) return;

    if (currentLineIdx >= 0 && lineEls[currentLineIdx]) {
      lineEls[currentLineIdx].classList.remove('current');
      lineEls[currentLineIdx].classList.add('passed');
    }
    currentLineIdx = idx;
    if (idx >= 0 && lineEls[idx]) {
      lineEls[idx].classList.remove('passed');
      lineEls[idx].classList.add('current');
      lineEls[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function startHighlightLoop() {
    if (highlightTimer) return;
    highlightTimer = setInterval(updateHighlight, 500);
  }

  function stopHighlightLoop() {
    if (highlightTimer) { clearInterval(highlightTimer); highlightTimer = null; }
  }

  // ─────────────────────────────────────────────
  // 렌더링
  // ─────────────────────────────────────────────
  function setArt(url) {
    if (!url) {
      artWrap.classList.remove('loaded');
      return;
    }
    artImg.onload = () => artWrap.classList.add('loaded');
    artImg.onerror = () => artWrap.classList.remove('loaded');
    artImg.src = url;
  }

  // result: {lines, plain} | null
  function setLyrics(result) {
    syncedLines = null;
    lineEls = [];
    currentLineIdx = -1;
    lyricsEl.textContent = '';

    if (!result || (!result.lines && !result.plain)) {
      lyricsEl.style.display = 'none';
      emptyStateEl.style.display = 'block';
      emptyStateEl.innerHTML =
        '<div class="icon">🎵</div><h2>가사를 찾지 못했어요</h2><p>이 곡은 가사 데이터가 없는 것 같아요.</p>';
      return;
    }

    if (result.lines && result.lines.length > 0) {
      // 싱크 모드: 줄별 div 렌더링 (textContent 사용 — HTML 주입 방지)
      syncedLines = result.lines;
      lyricsEl.classList.add('nosync'); // 앵커 수신 시 updateHighlight가 해제
      for (const line of syncedLines) {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.textContent = line.text;
        lyricsEl.appendChild(div);
        lineEls.push(div);
      }
    } else {
      // 폴백: 전체 텍스트 (하이라이트 없음)
      lyricsEl.textContent = result.plain;
    }

    lyricsEl.style.display = 'block';
    emptyStateEl.style.display = 'none';
    updateHighlight(); // 즉시 1회 반영 (앵커가 이미 있으면 현재 줄로 점프)
  }

  function setLoading() {
    lyricsEl.style.display = 'none';
    emptyStateEl.style.display = 'block';
    emptyStateEl.innerHTML =
      '<p id="status-line">가사를 불러오는 중…</p>';
  }

  // ─────────────────────────────────────────────
  // 메인 진입점 — 곡이 바뀌면 호출됨
  // ─────────────────────────────────────────────
  window.loadSong = async function loadSong(artist, album, title) {
    headerEl.classList.add('has-song');
    titleEl.textContent = title || '(제목 없음)';
    subEl.innerHTML = `${artist || ''}${album ? `<span class="dot">·</span>${album}` : ''}`;
    setArt(null);
    setLoading();

    const [artworkUrl, lyricsResult] = await Promise.all([
      fetchArtwork(artist, title).catch(err => { console.warn('[art]', err); return null; }),
      fetchLyrics(artist, title, album),
    ]);

    setArt(artworkUrl);
    setLyrics(lyricsResult);
  };

  // ─────────────────────────────────────────────
  // 테스트용: URL 쿼리 파라미터로 바로 확인 가능
  // 예: index.html?artist=아이유&title=좋은날&album=REAL
  // ─────────────────────────────────────────────
  const qs = new URLSearchParams(location.search);
  const TEST_MODE = !!(qs.get('artist') && qs.get('title'));
  if (TEST_MODE) {
    window.loadSong(qs.get('artist'), qs.get('album') || '', qs.get('title'));
  }

  // ─────────────────────────────────────────────
  // /now-playing 폴링 — "실행 중"일 때만 동작한다. 이 요청 자체가 프록시의
  // 하트비트를 갱신한다(3분 무신호 시 프록시가 자동 종료).
  //   - 곡이 바뀌면 loadSong()
  //   - 곡 정보가 비어 있으면(프록시가 타임아웃/외부 종료로 clear한 상태) → UI를 대기로 복귀.
  //     별도의 상태 동기화 폴링 없이, 이 실행-중 폴링 하나로 비동기 종료를 감지한다.
  //   - emptyCount로 몇 번 연속 비었을 때만 종료로 판단(시작 직후 곡 정보가 아직
  //     안 올라온 과도기를 종료로 오인하지 않도록).
  // ─────────────────────────────────────────────
  let lastSongKey = null;
  let emptyPolls = 0;
  const EMPTY_POLLS_TO_STOP = 3; // 연속 N회 곡 없음 → 프록시 종료로 간주

  async function pollNowPlaying() {
    try {
      const res = await fetch(`${CONFIG.BACKEND_URL}/now-playing`);
      if (!res.ok) return;
      const data = await res.json();

      if (!data || !data.artist || !data.title) {
        // 곡 정보 없음. 시작 직후 과도기일 수 있으므로 몇 번 참았다가,
        // 계속 비어 있으면 프록시가 종료된 것으로 보고 대기 상태로 복귀.
        emptyPolls += 1;
        if (running && emptyPolls >= EMPTY_POLLS_TO_STOP) {
          console.warn('[now-playing] 곡 정보 연속 없음 — 프록시 종료로 판단, 대기 복귀');
          applyRunning(false);
        }
        return;
      }

      emptyPolls = 0;

      // 매 폴링마다 재생 위치 앵커 갱신 (드라이버가 10초마다 넣어주는 elapsed 반영)
      setAnchor(data.elapsed_ms || 0, data.age_ms || 0, data.playback_status || '');

      const key = `${data.artist}|${data.album || ''}|${data.title}`;
      if (key !== lastSongKey) {
        lastSongKey = key;
        resetAnchor();  // 이전 곡의 위치가 새 곡으로 새지 않도록 초기화
        setAnchor(data.elapsed_ms || 0, data.age_ms || 0, data.playback_status || '');
        window.loadSong(data.artist, data.album || '', data.title);
      }
    } catch (e) {
      // 네트워크 실패는 종료로 간주하지 않음(일시적일 수 있음). UI 유지.
      console.warn('[now-playing] 폴링 실패:', e);
    }
  }

  // ─────────────────────────────────────────────
  // 노래방 상태 관리 (진실 원천 = 프록시)
  //   시작/종료는 웹페이지 버튼으로만 이루어진다.
  //   - "시작" 버튼 → POST /karaoke-start → 프록시 active=true + ST 스위치 ON → 실행 중 폴링 시작
  //   - "종료" 버튼 → POST /karaoke-stop  → 프록시 active=false + ST 스위치 OFF → 폴링 정지
  //   - 비동기 종료(3분 하트비트 타임아웃 등)는 프록시가 전담하며, 곡 정보를 비운다.
  //     웹은 실행 중 now-playing 폴링에서 "곡 없음"을 감지해 대기로 복귀한다.
  //   ※ 대기 상태에서는 어떤 폴링도 하지 않는다(터널 연결/rate 소모 방지).
  // ─────────────────────────────────────────────
  const toggleBtn   = document.getElementById('karaoke-toggle');
  const toggleLabel = document.getElementById('karaoke-toggle-label');

  let running = false;       // 웹 로컬 UI 상태
  let nowPlayingTimer = null;

  function setToggleState(state) {
    // state: 'idle' | 'running' | 'pending'
    toggleBtn.setAttribute('data-state', state);
    if (state === 'idle')        toggleLabel.textContent = '노래방 시작';
    else if (state === 'running') toggleLabel.textContent = '노래방 종료';
    else                          toggleLabel.textContent = '전환 중…';
  }

  function resetToWaiting() {
    // UI를 완전한 대기 상태로 되돌림
    lastSongKey = null;
    headerEl.classList.remove('has-song');
    titleEl.textContent = '노래를 기다리는 중…';
    subEl.textContent = '';
    setArt(null);
    lyricsEl.style.display = 'none';
    emptyStateEl.style.display = 'block';
    emptyStateEl.innerHTML =
      '<div class="icon">🎤</div><h2>대기 중</h2>' +
      '<p>노래방 시작을 누르면 재생 중인 곡의 가사가 표시됩니다.</p>';
  }

  function startNowPlayingLoop() {
    if (nowPlayingTimer) return;
    emptyPolls = 0;
    tracker.hasAnchor = false; // 이전 세션 앵커 무효화
    pollNowPlaying();
    nowPlayingTimer = setInterval(pollNowPlaying, CONFIG.POLL_INTERVAL_MS);
    startHighlightLoop();
  }

  function stopNowPlayingLoop() {
    if (nowPlayingTimer) {
      clearInterval(nowPlayingTimer);
      nowPlayingTimer = null;
    }
    stopHighlightLoop();
    tracker.hasAnchor = false;
  }

  // 웹 로컬 상태를 running/idle로 전환 (UI + 폴링 루프 동기화)
  function applyRunning(next) {
    if (next === running) return;
    running = next;
    if (running) {
      setToggleState('running');
      startNowPlayingLoop();
    } else {
      setToggleState('idle');
      stopNowPlayingLoop();
      resetToWaiting();
    }
  }

  async function requestStart() {
    setToggleState('pending');
    try {
      const res = await fetch(`${CONFIG.BACKEND_URL}/karaoke-start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source: 'web' }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      applyRunning(true);
    } catch (e) {
      console.warn('[karaoke] 시작 실패:', e);
      // 실패 시 프록시 실제 상태로 되돌림
      setToggleState(running ? 'running' : 'idle');
      alert('노래방 시작에 실패했어요. 잠시 후 다시 시도해주세요.');
    }
  }

  async function requestStop() {
    setToggleState('pending');
    try {
      const res = await fetch(`${CONFIG.BACKEND_URL}/karaoke-stop`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ source: 'web' }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      applyRunning(false);
    } catch (e) {
      console.warn('[karaoke] 종료 실패:', e);
      setToggleState(running ? 'running' : 'idle');
      alert('노래방 종료에 실패했어요. 잠시 후 다시 시도해주세요.');
    }
  }

  toggleBtn.addEventListener('click', function () {
    if (toggleBtn.getAttribute('data-state') === 'pending') return;
    if (running) requestStop();
    else         requestStart();
  });

  // 초기 진입: 대기 화면으로 시작. 대기 상태에서는 아무 폴링도 하지 않는다.
  // (프록시로의 연결 시도 자체를 없애 터널 rate/quota 소모를 막는다.)
  // 시작 버튼을 누르는 순간부터만 프록시와 통신한다.
  if (!TEST_MODE) {
    resetToWaiting();
  }
})();
</script>

</body>
</html>
