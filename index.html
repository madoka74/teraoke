<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노래방 가사 디스플레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-void:      #0e1016;
    --bg-stage:     #14171f;
    --spotlight:    #e8a33d;
    --spotlight-dim:#e8a33d33;
    --accent-rose:  #c4485c;
    --text-main:    #f2ede4;
    --text-dim:     #8b8680;
    --text-faint:   #55524c;
    --panel-border: #262a35;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg-void);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  /* ── 상단: 앨범아트 + 메타정보 (스포트라이트 아래 무대) ── */
  header {
    position: relative;
    display: flex;
    align-items: center;
    gap: clamp(16px, 3vw, 36px);
    padding: clamp(16px, 3vh, 32px) clamp(20px, 5vw, 56px);
    flex-shrink: 0;
    background: var(--bg-stage);
    border-bottom: 1px solid var(--panel-border);
    overflow: hidden;
  }

  /* 시그니처 요소: 앨범아트 뒤에서 번지는 스포트라이트 글로우 */
  header::before {
    content: "";
    position: absolute;
    top: 50%;
    left: clamp(20px, 5vw, 56px);
    width: clamp(120px, 14vw, 180px);
    height: clamp(120px, 14vw, 180px);
    transform: translateY(-50%);
    background: radial-gradient(circle, var(--spotlight-dim) 0%, transparent 70%);
    filter: blur(20px);
    pointer-events: none;
    transition: opacity 0.6s ease;
    opacity: 0;
  }
  header.has-song::before { opacity: 1; }

  #art-wrap {
    position: relative;
    flex-shrink: 0;
    width: clamp(88px, 11vw, 148px);
    height: clamp(88px, 11vw, 148px);
    border-radius: 10px;
    overflow: hidden;
    background: #1b1e27;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
  }
  #art-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }
  #art-wrap.loaded img { display: block; }
  #art-wrap .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(28px, 4vw, 44px);
    color: var(--text-faint);
  }
  #art-wrap.loaded .placeholder { display: none; }

  #meta {
    min-width: 0;
    position: relative;
  }
  #meta .eyebrow {
    font-size: clamp(10px, 1vw, 12px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--spotlight);
    font-weight: 600;
    margin: 0 0 6px;
  }
  #song-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(22px, 3.4vw, 40px);
    line-height: 1.15;
    margin: 0 0 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #song-sub {
    font-size: clamp(13px, 1.5vw, 17px);
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #song-sub .dot { margin: 0 8px; color: var(--text-faint); }

  /* ── 본문: 전체 가사 ── */
  main {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    padding: clamp(28px, 5vh, 64px) clamp(20px, 6vw, 40px) clamp(60px, 10vh, 120px);
  }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 6px; }
  main::-webkit-scrollbar-track { background: transparent; }

  #lyrics {
    max-width: 760px;
    width: 100%;
    font-size: clamp(19px, 2.4vw, 30px);
    line-height: 1.9;
    font-weight: 500;
    color: var(--text-main);
    white-space: pre-wrap;
    text-align: center;
  }

  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    max-width: 420px;
  }
  #empty-state .icon {
    font-size: 40px;
    margin-bottom: 14px;
    opacity: 0.6;
  }
  #empty-state h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    color: var(--text-main);
    font-size: 22px;
    margin: 0 0 10px;
  }
  #empty-state p {
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
  }
  #empty-state code {
    background: var(--bg-stage);
    border: 1px solid var(--panel-border);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--spotlight);
  }

  #status-line {
    color: var(--text-dim);
    font-size: 15px;
    text-align: center;
  }

  @media (max-width: 560px) {
    header { gap: 14px; padding: 14px 18px; }
    #song-title { white-space: normal; }
    #song-sub { white-space: normal; }
  }
</style>
</head>
<body>

<header id="header">
  <div id="art-wrap">
    <div class="placeholder">♪</div>
    <img id="art-img" alt="">
  </div>
  <div id="meta">
    <p class="eyebrow">지금 재생 중</p>
    <h1 id="song-title">노래를 기다리는 중…</h1>
    <p id="song-sub"></p>
  </div>
</header>

<main>
  <div id="empty-state">
    <div class="icon">🎤</div>
    <h2>대기 중</h2>
    <p>
      곡 정보가 들어오면 여기에 가사가 표시됩니다.<br>
      테스트하려면 URL에 다음처럼 붙여보세요:<br><br>
      <code>?artist=아이유&title=좋은날&album=REAL</code>
    </p>
  </div>
  <div id="lyrics" style="display:none;"></div>
</main>

<script>
(function () {
  const headerEl   = document.getElementById('header');
  const artWrap     = document.getElementById('art-wrap');
  const artImg       = document.getElementById('art-img');
  const titleEl       = document.getElementById('song-title');
  const subEl           = document.getElementById('song-sub');
  const lyricsEl          = document.getElementById('lyrics');
  const emptyStateEl        = document.getElementById('empty-state');

  // ─────────────────────────────────────────────
  // 앨범아트: iTunes Search API (공개, CORS 허용, 인증 불필요)
  // ─────────────────────────────────────────────
  async function fetchArtwork(artist, title) {
    const term = encodeURIComponent(`${artist} ${title}`);
    const url = `https://itunes.apple.com/search?term=${term}&media=music&limit=1`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`iTunes 검색 실패: HTTP ${res.status}`);
    const data = await res.json();
    if (!data.results || data.results.length === 0) return null;
    // artworkUrl100 → 더 큰 사이즈로 치환 (공식 지원되는 URL 패턴)
    return data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
  }

  // ─────────────────────────────────────────────
  // 가사: LRCLIB 우선(동기화 있으면 텍스트만 추출) → lyrics.ovh 폴백
  // 실시간 동기화는 필요 없으므로 전체 텍스트만 사용
  // ─────────────────────────────────────────────
  function syncedToPlain(syncedLyrics) {
    return syncedLyrics
      .split('\n')
      .map(line => line.replace(/^\[\d+:\d+\.\d+\]\s*/, ''))
      .filter(line => line.trim() !== '')
      .join('\n');
  }

  async function fetchLyricsFromLrclib(artist, title, album) {
    const params = new URLSearchParams({ track_name: title, artist_name: artist });
    if (album) params.set('album_name', album);
    const res = await fetch(`https://lrclib.net/api/get?${params.toString()}`);
    if (!res.ok) return null;
    const data = await res.json();
    if (data.syncedLyrics) return syncedToPlain(data.syncedLyrics);
    if (data.plainLyrics) return data.plainLyrics;
    return null;
  }

  async function fetchLyricsFromOvh(artist, title) {
    const url = `https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    return data.lyrics || null;
  }

  async function fetchLyrics(artist, title, album) {
    try {
      const fromLrclib = await fetchLyricsFromLrclib(artist, title, album);
      if (fromLrclib) return fromLrclib;
    } catch (e) { console.warn('[lyrics] lrclib 실패:', e); }

    try {
      const fromOvh = await fetchLyricsFromOvh(artist, title);
      if (fromOvh) return fromOvh;
    } catch (e) { console.warn('[lyrics] lyrics.ovh 실패:', e); }

    return null;
  }

  // ─────────────────────────────────────────────
  // 렌더링
  // ─────────────────────────────────────────────
  function setArt(url) {
    if (!url) {
      artWrap.classList.remove('loaded');
      return;
    }
    artImg.onload = () => artWrap.classList.add('loaded');
    artImg.onerror = () => artWrap.classList.remove('loaded');
    artImg.src = url;
  }

  function setLyrics(text) {
    if (text) {
      lyricsEl.textContent = text;
      lyricsEl.style.display = 'block';
      emptyStateEl.style.display = 'none';
    } else {
      lyricsEl.style.display = 'none';
      emptyStateEl.style.display = 'block';
      emptyStateEl.innerHTML =
        '<div class="icon">🎵</div><h2>가사를 찾지 못했어요</h2><p>이 곡은 가사 데이터가 없는 것 같아요.</p>';
    }
  }

  function setLoading() {
    lyricsEl.style.display = 'none';
    emptyStateEl.style.display = 'block';
    emptyStateEl.innerHTML =
      '<p id="status-line">가사를 불러오는 중…</p>';
  }

  // ─────────────────────────────────────────────
  // 메인 진입점 — 외부에서 곡 정보를 받으면 이 함수 하나만 호출하면 됨.
  // (POST 수신 방식은 추후 확정 — 그 브릿지가 완성되면 여기로 연결)
  // ─────────────────────────────────────────────
  window.loadSong = async function loadSong(artist, album, title) {
    headerEl.classList.add('has-song');
    titleEl.textContent = title || '(제목 없음)';
    subEl.innerHTML = `${artist || ''}${album ? `<span class="dot">·</span>${album}` : ''}`;
    setArt(null);
    setLoading();

    const [artworkUrl, lyricsText] = await Promise.all([
      fetchArtwork(artist, title).catch(err => { console.warn('[art]', err); return null; }),
      fetchLyrics(artist, title, album),
    ]);

    setArt(artworkUrl);
    setLyrics(lyricsText);
  };

  // ─────────────────────────────────────────────
  // 테스트용: URL 쿼리 파라미터로 바로 확인 가능
  // 예: index.html?artist=아이유&title=좋은날&album=REAL
  // ─────────────────────────────────────────────
  const qs = new URLSearchParams(location.search);
  if (qs.get('artist') && qs.get('title')) {
    window.loadSong(qs.get('artist'), qs.get('album') || '', qs.get('title'));
  }
})();
</script>

</body>
</html>
